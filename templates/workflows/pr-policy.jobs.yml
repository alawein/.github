# Opt-in jobs fragment: merge these jobs under jobs in .github/workflows/policy.yml.
# Never copy this fragment as a standalone workflow or merge it into build CI.
# Prefer the kit split: keep SHA lint/build in ci.yml without `edited`, and put
# title/policy (including `edited`) in policy.yml. See .github/workflows/policy.yml.
# Configure pull_request types opened, edited, synchronize, reopened,
# ready_for_review and converted_to_draft, and push to main.
# Set top-level contents: read and a distinct concurrency group for every run,
# for example policy-${{ github.run_id }}, with cancel-in-progress: false.
# If a consumer still keeps `edited` on a single CI stub (Mode A), retain the
# edited-only metadata-${{ github.run_id }} carve-out; non-edited pull_request
# actions must still cancel superseded runs. Do not remove the carve-out while
# `edited` remains on that CI stub.
# No inherited secrets are needed.
# Callers that pin a kit revision with the PR-commit attribution check (#77+)
# must grant pull-requests: read; contents: read stays required for checkout.
# Granting both is safe on older freeze pins that only declare contents: read.
run-pr-policy:
  permissions:
    contents: read
    pull-requests: read
  uses: alawein/.github/.github/workflows/pr-policy.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates
  with:
    require-sections: true
    kit-ref: cc3b595f8e9e92a9ed6fc63b3be177cc8a571965

pr-policy:
  needs: [run-pr-policy]
  if: ${{ always() }}
  runs-on: ubuntu-24.04
  timeout-minutes: 1
  permissions: {}
  steps:
    - name: Require policy success
      env:
        RESULT: ${{ needs.run-pr-policy.result }}
      run: |
        test "$RESULT" = "success"
