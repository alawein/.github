# Copy to .github/workflows/hygiene-weekly.yml independently of the CI fragment.
# List current effective required contexts explicitly; add node-ci/python-ci for
# code classes and pr-policy only after live required-context promotion.
name: Weekly hygiene

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    permissions:
      contents: read
      pull-requests: read
    uses: alawein/.github/.github/workflows/hygiene.yml@b5f8bc3a916b41e22e5e09ec72f34c01428c2933 # v1.3.0
    with:
      expected-required-checks: markdown-lint,link-check,actionlint,pr-title
