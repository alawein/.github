# Copy to .github/workflows/claude-review.yml in a consumer repository.
# Pin the ref after "@" to a full 40-character commit SHA of alawein/.github.
#
# Triggers:
#   - Add the `review:claude` label in the PR sidebar (one-click trigger)
#   - Comment `@claude review` on a PR (owner only)
#   - Run manually via Actions -> Claude Review -> Run workflow (workflow_dispatch)

name: Claude Review

on:
  pull_request:
    types: [labeled]
  issue_comment: # zizmor: ignore[dangerous-triggers] -- owner-only actor gate, PR-only, fork check & trusted default-branch checkout
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude-review:
    if: >-
      github.actor == 'alawein' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.label.name == 'review:claude' &&
          !github.event.pull_request.head.repo.fork
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@claude review')
        )
      )
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: alawein/.github/.github/workflows/claude-review.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # claude-review
    with:
      allowed-actor: alawein
      label-trigger: review:claude
      trigger-phrase: "@claude review"
      pr-number: ${{ inputs.pr_number || '' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
