# Class: tool in Python, or lab (uv or pip projects with ruff and pytest).
# Copy to .github/workflows/ci.yml in the repo.
#
# The pin after "@" must be a full 40-character commit SHA of alawein/.github.
# To update it: find the new SHA (gh api repos/alawein/.github/commits/main --jq .sha),
# replace all pins in this file at once, and open a PR. Steps are in docs/ci.md, "Bump a pin".
# Once alawein/.github has release tags, the github-actions Dependabot entry can also propose this bump.
#
# Required checks for the ruleset: markdown-lint, link-check, actionlint, pr-title, python-ci

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@a2f16663330afe2bd8ac4ee548121f495e866e4c # v1.0.0

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@a2f16663330afe2bd8ac4ee548121f495e866e4c # v1.0.0

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@a2f16663330afe2bd8ac4ee548121f495e866e4c # v1.0.0

  run-pr-title:
    permissions:
      pull-requests: read
    uses: alawein/.github/.github/workflows/pr-title.yml@a2f16663330afe2bd8ac4ee548121f495e866e4c # v1.0.0

  run-python-ci:
    uses: alawein/.github/.github/workflows/python-ci.yml@a2f16663330afe2bd8ac4ee548121f495e866e4c # v1.0.0
    with:
      python-version: "3.13"
      installer: uv

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      # The title check is skipped on push to main, so skipped counts as a pass here.
      - name: Require success or skipped
        env:
          RESULT: ${{ needs.run-pr-title.result }}
        run: '[ "$RESULT" = "success" ] || [ "$RESULT" = "skipped" ]'

  python-ci:
    needs: [run-python-ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-python-ci.result }}
        run: test "$RESULT" = "success"
