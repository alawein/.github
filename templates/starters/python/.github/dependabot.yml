# Copy to .github/dependabot.yml. Used by the python and lab starters.
# The "chore" label must exist in the repo, or Dependabot skips the label.
# This project is locked with uv.lock, so the first ecosystem is "uv".
# Set "directory" to the folder that holds pyproject.toml or requirements files if it is not the root.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore(deps)"
