name: External link check

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@cc3b595f8e9e92a9ed6fc63b3be177cc8a571965 # quality gates
    with:
      offline: false
