name: External link check

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@4fb018bbf776a0d9d78eb3016770720e4e52e2c5 # quality gates
    with:
      offline: false
