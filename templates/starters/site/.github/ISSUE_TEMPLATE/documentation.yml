name: Documentation
description: Correct or improve instructions and reference material.
title: "docs: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: Reports receive best-effort triage; no response deadline is guaranteed.
  - type: input
    id: location
    attributes:
      label: Document or URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Incorrect or missing information
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected reader outcome
      description: State the instruction or useful result the reader needs.
    validations:
      required: true
