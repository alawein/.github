# Copy to .github/dependabot.yml. Use for python repos.
# The "chore" label must exist in the repo, or Dependabot skips the label.
# For a project locked with uv.lock, change the first package-ecosystem from "pip" to "uv".
# Set "directory" to the folder that holds pyproject.toml or requirements files if it is not the root.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore(deps)"
