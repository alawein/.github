name: Feature request
description: Suggest a new capability or a change in behavior.
title: "feat: "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before writing code. A pull request without a
        discussion may be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to see. Keep it small.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including doing nothing.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: How we would know it works.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched existing issues.
          required: true
