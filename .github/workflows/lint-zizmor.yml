name: Audit workflow security

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-zizmor-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse to run in an archive repo
        env:
          REPO: ${{ github.repository }}
        run: |
          case "${REPO#*/}" in
            ARCHIVE-*) echo "::error::${REPO} is an archive repo. Workflows never run here."; exit 1 ;;
          esac

  lint:
    needs: [archive-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Release archive pinned by version and sha256 (the asset digest GitHub publishes for tag
      # v1.32.0), so this reusable workflow needs no kit checkout. Not a `uses:`, so it is bumped
      # by hand: change the version and the checksum together (see docs/pins.md).
      - name: Install zizmor v1.32.0
        shell: bash
        env:
          ZIZMOR_VERSION: "1.32.0"
          ZIZMOR_SHA256: "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" zizmor
      - name: Audit workflows
        run: '"$RUNNER_TEMP/zizmor" --no-online-audits .github/workflows'
