name: Weekly hygiene

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    permissions:
      contents: read
      pull-requests: read
    uses: $/.github/workflows/hygiene.yml
    with:
      expected-required-checks: run-markdown-lint / lint,run-link-check / lint,run-actionlint / lint,run-zizmor / lint,metadata-tests,pr-title,pr-policy
