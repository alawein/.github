name: PR policy

on:
  workflow_call:
    inputs:
      kit-ref:
        description: Full kit commit SHA; only kit self-tests may omit it.
        type: string
        default: ""
      require-sections:
        description: Ignored; kept so pinned callers that still pass it do not break.
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read # list PR commits; squash merges keep their Co-authored-by trailers

concurrency:
  group: pr-policy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse to run in an archive repo
        env:
          REPO: ${{ github.repository }}
        run: |
          case "${REPO#*/}" in
            ARCHIVE-*) echo "::error::${REPO} is an archive repo. Workflows never run here."; exit 1 ;;
          esac
      - name: Validate kit ref
        id: ref
        env:
          KIT_REF: ${{ inputs.kit-ref }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          if [ -z "$KIT_REF" ]; then
            if [ "$CALLER_REPOSITORY" != "alawein/.github" ]; then
              echo '::error::Foreign callers must supply the full immutable kit-ref.'
              exit 1
            fi
            KIT_REF="$CALLER_SHA"
          fi
          if [[ ! "$KIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::kit-ref must be a full lowercase commit SHA.'
            exit 1
          fi
          echo "kit-ref=$KIT_REF" >> "$GITHUB_OUTPUT"
      - name: Check out policy implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alawein/.github
          ref: ${{ steps.ref.outputs.kit-ref }}
          path: _kit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Fetch PR commit messages
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER/commits" --paginate \
            --jq '.[] | {sha, message: .commit.message}' > "$RUNNER_TEMP/commits.jsonl"
      - name: Validate caller event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python _kit/scripts/check-pr-policy.py --event "$GITHUB_EVENT_PATH" --commits "$RUNNER_TEMP/commits.jsonl"
          else
            python _kit/scripts/check-pr-policy.py --event "$GITHUB_EVENT_PATH"
          fi
