name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version, for example 22 or lts/*.
        type: string
        default: "lts/*"
      working-directory:
        description: Folder that holds package.json and package-lock.json.
        type: string
        default: "."
      run-lint:
        type: boolean
        default: true
      run-test:
        type: boolean
        default: true
      require-test:
        type: boolean
        default: false
      run-build:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archive-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse to run in an archive repo
        env:
          REPO: ${{ github.repository }}
        run: |
          case "${REPO#*/}" in
            ARCHIVE-*) echo "::error::${REPO} is an archive repo. Workflows never run here."; exit 1 ;;
          esac

  ci:
    needs: [archive-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Require a runnable test script
        if: inputs.require-test
        env:
          RUN_TEST: ${{ inputs.run-test }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.RUN_TEST !== "true") {
              console.error("::error::require-test: true requires run-test: true.");
              process.exit(1);
            }
            if (typeof p.scripts?.test !== "string" || p.scripts.test.trim() === "") {
              console.error("::error::require-test: true requires a nonempty package.json scripts.test script.");
              process.exit(1);
            }
          '
      # npm ci installs exactly what the lockfile says and fails if the two disagree.
      - name: Install
        run: npm ci
      - name: Lint
        if: inputs.run-lint
        run: npm run lint --if-present
      - name: Test
        if: inputs.run-test && !inputs.require-test
        run: npm test --if-present
      - name: Test (required)
        if: inputs.require-test
        run: npm test
      - name: Build
        if: inputs.run-build
        run: npm run build --if-present
