name: CI

# This repo tests its own reusable workflows by calling them from the same commit.
# A called job reports as "<caller job> / <called job>", so small gate jobs below
# carry stable check names; metadata-tests reports its own check. The ruleset requires:
#   markdown-lint, link-check, actionlint, zizmor, metadata-tests
# plus pr-title and pr-policy from policy.yml. No `edited` trigger here: a PR body edit
# would start a run on the same SHA that cancels this one and fails its gates.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: $/.github/workflows/lint-markdown.yml

  run-link-check:
    uses: $/.github/workflows/check-links.yml
    with:
      offline: true

  run-actionlint:
    uses: $/.github/workflows/lint-actions.yml

  run-zizmor:
    uses: $/.github/workflows/lint-zizmor.yml

  metadata-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Test metadata and workflow guards
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      # The root suite runs generated consumers through actionlint, just and lychee (the version
      # lychee-action v2.9.0 installs). Release archives are pinned by version and sha256 like
      # lint-actions.yml; change version and checksum together.
      - name: Install actionlint v1.7.12, just 1.59.0 and lychee 0.24.2
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          JUST_VERSION: "1.59.0"
          JUST_SHA256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$bin" actionlint
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$bin" just
          archive="lychee-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}"
          echo "${LYCHEE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$bin" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$bin" >> "$GITHUB_PATH"
          # The root lychee tests fail instead of skipping when CI=true and this is unset.
          echo "LYCHEE_BIN=$bin/lychee" >> "$GITHUB_ENV"
      # The root suite parses workflow YAML; PyYAML installs only from the hash-pinned wheels.
      - name: Install root test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r tests/requirements.txt
      - name: Test reusable workflow behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  zizmor:
    needs: [run-zizmor]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-zizmor.result }}
        run: test "$RESULT" = "success"
