name: CI

# This repo tests its own reusable workflows by calling them from the same commit.
# A called job reports as "<caller job> / <called job>", so four small gate jobs below
# carry the exact check names the ruleset requires:
#   markdown-lint, link-check, actionlint, pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: ./.github/workflows/lint-markdown.yml

  run-link-check:
    uses: ./.github/workflows/check-links.yml
    with:
      offline: true

  run-actionlint:
    uses: ./.github/workflows/lint-actions.yml

  run-pr-title:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/pr-title.yml

  run-pr-policy:
    uses: ./.github/workflows/pr-policy.yml

  metadata-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Test metadata and workflow guards
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  pr-policy:
    needs: [run-pr-policy, metadata-tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require policy and metadata tests
        env:
          RESULT: ${{ needs.run-pr-policy.result }}
          TESTS: ${{ needs.metadata-tests.result }}
        run: |
          test "$RESULT" = "success" && test "$TESTS" = "success"

  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      # Only the actual main-push event may omit PR-title evaluation.
      - name: Require success or eligible main-push skip
        env:
          RESULT: ${{ needs.run-pr-title.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [ "$RESULT" = "success" ] || {
            [ "$RESULT" = "skipped" ] && [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]
          }
