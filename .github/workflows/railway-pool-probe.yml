# Non-required probe of the Railway self-hosted pool. Kept off PR/push CI so
# every kit change does not wait on self-hosted start queue or bill a second
# metadata suite. Schedule + manual dispatch only; not a required check.
name: Railway pool probe

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-pool-probe
  cancel-in-progress: true

jobs:
  metadata-tests-railway:
    runs-on: [self-hosted, railway, ephemeral]
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.10"
      - name: Fast path metadata suite
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
