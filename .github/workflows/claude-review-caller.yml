name: Claude review

on:
  # Safe here: the callee runs only for the owner, refuses fork PRs, reads policy from the default branch and has read-only tools.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read

# Broad issue_comment / labeled triggers join this group before job `if` filters.
# Never cancel-in-progress here: an unrelated comment or label would abort a live review.
concurrency:
  group: claude-review-caller-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude-review:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'review:claude')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: alawein/.github/.github/workflows/claude-review.yml@4b86da1b0c9d7b0333646279117755da800dff73 # v1.5.1
    with:
      pr-number: ${{ inputs.pr_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
