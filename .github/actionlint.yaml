# actionlint rules for this repository. See https://github.com/rhysd/actionlint/blob/main/docs/config.md
paths:
  .github/workflows/**/*.yml:
    ignore:
      # GitHub's self-repository uses: $/... syntax (July 2026) is what zizmor's self-repository
      # audit asks for in place of ./..., and what our in-repo reusable-workflow calls use.
      # actionlint 1.7.12 predates the syntax (rhysd/actionlint#760); drop these once a release
      # knows it. Each ignore is anchored to the exact called workflow, so a new $/ call is a
      # deliberate edit here rather than a silent pass.
      - '^reusable workflow call "\$/\.github/workflows/hygiene\.yml" at "uses" is not following the format'
      - '^reusable workflow call "\$/\.github/workflows/check-links\.yml" at "uses" is not following the format'
      - '^reusable workflow call "\$/\.github/workflows/lint-markdown\.yml" at "uses" is not following the format'
      - '^reusable workflow call "\$/\.github/workflows/lint-actions\.yml" at "uses" is not following the format'
      - '^reusable workflow call "\$/\.github/workflows/pr-title\.yml" at "uses" is not following the format'
      - '^reusable workflow call "\$/\.github/workflows/pr-policy\.yml" at "uses" is not following the format'
