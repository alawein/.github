version: 2
updates:
  # Keeps the hash-pinned root test dependency (tests/requirements.txt) current; version and hashes move together.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
  # Bumps the SHA-pinned actions in .github/workflows (templates/ pins this repo and moves with each release).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
