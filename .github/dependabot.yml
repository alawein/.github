# Dependabot for this kit: bumps the pinned actions in .github/workflows (see docs/pins.md).
# The "chore" label must exist in the repo, or Dependabot skips the label.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "chore"
    commit-message:
      prefix: "chore(deps)"
