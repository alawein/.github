version: 2
# Renovate (default.json) owns version-update PRs: house branches (chore/deps-*) and
# the five pr-policy evidence sections. Dependabot limits stay 0 so it does not open
# dependabot/* branches that fail pr-policy. See docs/ci.md "Dependency update bots".
updates:
  # Keeps the hash-pinned root test dependency (tests/requirements.txt) current; version and hashes move together.
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0 # Renovate owns new version-update PRs after adoption.
  # Bumps the SHA-pinned actions in .github/workflows (templates/ pins this repo and moves with each release).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 0 # Keep existing PRs; do not create duplicates.
