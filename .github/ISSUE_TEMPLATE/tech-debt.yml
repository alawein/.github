name: Technical debt
description: Reduce a demonstrated maintenance or performance cost.
title: "chore: "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: Reports receive best-effort triage; no response deadline is guaranteed.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and affected files
      description: Show the failure, duplication, measurement, or maintenance cost.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Done when
      description: Give verifiable acceptance criteria and compatibility requirements.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
    validations:
      required: true
