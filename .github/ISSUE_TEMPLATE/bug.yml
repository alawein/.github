name: Bug report
description: Something does not work as documented.
title: "fix: "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form.
        Use "Report a vulnerability" on the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest steps that show the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag or a short commit hash.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, and browser if it matters.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste text output here. Remove tokens and personal data first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and personal data.
          required: true
